<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Text Formatting in HTML</title>
</head>

<body>

    <!-- Emphasised text -->
    <em>HTML</em>

    <br>

    <!-- Italic text -->
    <i>HTML</i>

    <br>

    <!-- Underlined text -->
    <u>HTML</u>

    <br>

    <!-- Bold text -->
    <b>HTML</b>

    <br>

    <!-- Important bold text -->
    <strong>HTML</strong>

    <br>

    <!-- Highlighted text -->
    <mark>HTML</mark>

    <br>

    <!-- Smaller text -->
    <small>HTML</small>

    <br>

    <!-- Deleted text -->
    <del>HTML</del>

    <br>

    <!-- Inserted text -->
    npsb;<ins>HTML</ins>              
    

    <br>

    <!-- Superscript text -->
    1<sup>st</sup>

    <br>

    <!-- Subscript text -->
    H<sub>2</sub>O

</body>

</html>
